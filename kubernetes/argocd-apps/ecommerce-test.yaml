apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/guthulavasu/ecommerce-gitops.git
    targetRevision: main
    path: kubernetes/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true