apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/namespace.yaml
  - ../../base/backend.yaml
  - ../../base/backend-service.yaml
  - ../../base/frontend.yaml
  - ../../base/frontend-service.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: ecommerce-dev-mysql.ckvg40wk6cti.us-east-1.rds.amazonaws.com
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: ecommerceadmin
